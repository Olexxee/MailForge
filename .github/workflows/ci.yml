name: CI

concurrency:
  group: phase-0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mailforge
          POSTGRES_PASSWORD: mailforge
          POSTGRES_DB: mailforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailforge -d mailforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mailforge:mailforge@localhost:5432/mailforge?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate:deploy --workspace=@mailforge/database
      - run: npm run test
      - run: npm run build
